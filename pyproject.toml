[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-cache-mesh"
version = "0.1.0"
description = "High-performance two-tier (L1 in-memory LRU + L2 SQLite) caching engine with cache-stampede prevention (single-flight) and TTL jitter."
readme = "README.md"
authors = [{ name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
